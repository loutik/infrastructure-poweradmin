# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name padm.infra.loutik.fr;
    server_tokens off; # Cache la version de NGINX

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name padm.infra.loutik.fr;
    server_tokens off; # Cache la version de NGINX

    # Chemins vers les certificats montés dans le conteneur
    ssl_certificate /etc/nginx/certs/padm.infra.loutik.fr.crt;
    ssl_certificate_key /etc/nginx/certs/padm.infra.loutik.fr.key;
    
    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://poweradmin; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}